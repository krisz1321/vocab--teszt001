<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>VocabApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // A mentett téma beállítása az első festés előtt, hogy ne villanjon.
    (function () {
      try {
        var name = localStorage.getItem('vocabapp.theme');
        var mode = localStorage.getItem('vocabapp.mode') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', ['ocean', 'forest', 'sunset'].indexOf(name) >= 0 ? name : 'ocean');
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'ocean');
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
