<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>WordTárs</title>
  <base href="/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700;800&display=swap">
  <script>
    // Festés előtt beállítja a témát, hogy ne villanjon a világos háttér (ugyanaz a kulcs, mint a ThemeService-ben).
    (function () {
      var choice = 'system';
      try { choice = localStorage.getItem('vocabapp.theme') || 'system'; } catch (e) { /* tárolás nélkül a rendszer témája */ }
      var dark = choice === 'dark' || (choice === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
